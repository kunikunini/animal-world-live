<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#d99a4a" />
    <title>ANIMAL WORLD LIVE</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="world" aria-label="サバンナの3Dワールド"></canvas>

    <div id="entry" class="overlay">
      <div class="entry-card">
        <p class="entry-kicker">ANIMAL WORLD LIVE</p>
        <h1 class="entry-title">世界中の動物たちと、<br />友達になろう。</h1>
        <p class="entry-lead">夕暮れのサバンナを歩いて、ライオンたちに会いに行こう。</p>
        <button id="enter" class="btn btn-primary" type="button">世界に入る</button>
        <p class="entry-hint">タップした場所へ歩きます。キーボードの W A S D でも動けます。</p>
      </div>
    </div>

    <div id="fallback" class="overlay" hidden>
      <div class="entry-card">
        <p class="entry-kicker">ANIMAL WORLD LIVE</p>
        <h1 class="entry-title">このブラウザでは3Dを表示できません</h1>
        <p class="entry-lead">WebGLが使えない環境のようです。別のブラウザか端末でもう一度開いてみてください。</p>
      </div>
    </div>

    <div id="spot-label" class="spot-label" hidden aria-hidden="true">
      <span class="spot-label-name">観察スポット</span>
      <span id="spot-distance" class="spot-label-distance"></span>
    </div>

    <div id="arrived" class="banner" hidden role="status">
      <span>観察スポットに着きました</span>
      <button id="view-spot" class="btn btn-primary btn-small" type="button">双眼鏡で見る</button>
    </div>

    <section id="observe" class="observe" hidden aria-label="観察モニター">
      <div class="observe-panel">
        <header class="observe-header">
          <h2 id="observe-title" class="observe-title">観察モニター</h2>
          <button id="observe-close" class="btn btn-ghost" type="button">世界に戻る</button>
        </header>
        <div class="observe-screen">
          <video id="observe-video" class="observe-video" playsinline preload="metadata" controls controlslist="nodownload"></video>
          <div id="observe-poster" class="observe-poster">
            <p id="observe-poster-text" class="observe-poster-text">タップして再生</p>
            <button id="observe-play" class="btn btn-primary" type="button">再生する</button>
            <button id="observe-retry" class="btn btn-primary" type="button" hidden>もう一度試す</button>
          </div>
          <span id="observe-badge" class="observe-badge">収録映像</span>
          <span id="observe-placeholder" class="observe-placeholder" hidden>仮映像（色と文字だけの自作プレースホルダ）</span>
        </div>
        <div id="observe-profile" class="observe-profile"></div>
      </div>
    </section>

    <div id="hud" class="hud" hidden>
      <div class="hud-left">
        <label class="toggle">
          <input id="reduce-motion" type="checkbox" />
          <span>動きをへらす</span>
        </label>
        <div id="fps" class="fps" hidden></div>
      </div>
      <div class="hud-center">
        <button id="goto-spot" class="btn btn-primary btn-small" type="button">観察スポットへ</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
