<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2b1d12" />
    <title>スタッフ画面（試作） — ANIMAL WORLD LIVE</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/src/staff.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="M7.5 5v14M16.5 5v14M3 10h4.5M3 14h4.5M16.5 10H21M16.5 14H21" /></symbol>
      <symbol id="i-bubble" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V16A2.5 2.5 0 0 1 4 13.5v-7z" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
    </svg>
    <div id="app" class="st-app">
      <header class="st-top">
        <div class="st-brand">
          <span class="st-logo">ANIMAL WORLD LIVE</span>
          <h1 class="st-h1">スタッフ画面 <span class="st-tag">試作</span></h1>
        </div>
        <a class="st-link" href="/" target="_blank" rel="noopener">ともだち帳（アプリ）を開く</a>
      </header>
      <p class="st-banner" role="note">
        試作版: この画面はこの端末（ブラウザ）の中だけで動きます。出したお知らせは、同じ端末のともだち帳に届きます。サーバー・ログイン・ほかの端末への配信はまだありません。
      </p>
      <section id="st-pop" class="st-pop" aria-labelledby="st-pop-h"></section>
      <main id="st-main" class="st-main"></main>
      <p id="st-toast" class="st-toast" role="status" hidden></p>
    </div>
    <script type="module" src="/src/staff/main.ts"></script>
  </body>
</html>
